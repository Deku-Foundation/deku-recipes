[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deku-recipes-validator"
version = "0.1.0"
description = "Metadata-only recipe validator for Deku Linux"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
deku-recipe-check = "deku_recipes.validate_cli:main"

[tool.setuptools.packages.find]
include = ["deku_recipes*"]
